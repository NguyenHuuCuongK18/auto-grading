# Supervisord Configuration for Unified Container
# Manages server and client processes independently
# Logs are written per stage to separate files

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=127.0.0.1:9001

# Server process configuration
# Started/stopped by test case actions via unified-control.sh
# Logs are written per stage to /apps/server/server-stage-N.log
[program:server]
command=/bin/bash -c "cd /apps/server && find . -name '*.dll' -not -name 'System.*.dll' -not -name 'Microsoft.*.dll' | head -1 | xargs dotnet"
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/apps/server/server-stage-%(ENV_STAGE)s.log
stderr_logfile=/apps/server/server-stage-%(ENV_STAGE)s.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
environment=DOTNET_CLI_TELEMETRY_OPTOUT=1,DOTNET_RUNNING_IN_CONTAINER=true,DOTNET_SYSTEM_CONSOLE_UNBUFFERED=1,STAGE=0

# Pipe keeper process - keeps named pipe open to prevent EOF when client starts
# CRITICAL: This process MUST start before the client to hold the pipe open
# Without this, client gets immediate EOF when reading from pipe and exits
[program:pipe-keeper]
command=/bin/bash -c "exec tail -f /dev/null > /tmp/client_input"
autostart=true
autorestart=true
startsecs=0
startretries=3
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=1

# Client process configuration  
# Started/stopped by test case actions via unified-control.sh
# Logs are written per stage to /apps/client/client-stage-N.log
# CRITICAL: Client reads from named pipe /tmp/client_input for input
# The pipe-keeper process holds the pipe open to prevent immediate EOF
# Uses command substitution to find DLL first, then redirect stdin to dotnet
[program:client]
command=/bin/bash -c "cd /apps/client && DLL=$(find . -maxdepth 1 -name '*.dll' -not -name 'System.*.dll' -not -name 'Microsoft.*.dll' | head -1) && exec dotnet \"$DLL\" < /tmp/client_input"
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/apps/client/client-stage-%(ENV_STAGE)s.log
stderr_logfile=/apps/client/client-stage-%(ENV_STAGE)s.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
environment=DOTNET_CLI_TELEMETRY_OPTOUT=1,DOTNET_RUNNING_IN_CONTAINER=true,DOTNET_SYSTEM_CONSOLE_UNBUFFERED=1,STAGE=0
priority=10
