# Supervisord Configuration for Unified Container
# Manages server and client processes independently
# Logs are written per stage to separate files

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=127.0.0.1:9001

# Server process configuration
# Started/stopped by test case actions via unified-control.sh
# Logs are written to /apps/server/server.log (unified log file)
# Uses wrapper script to redirect all output
[program:server]
command=/scripts/server-wrapper.sh
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# Pipe keeper process - keeps named pipe open to prevent EOF when client starts
# CRITICAL: This is a first-class supervisord process (priority=1) that starts BEFORE client
# Uses 'sleep infinity' (valid on Debian) to hold write-end of pipe open indefinitely
# This prevents clients from receiving EOF when they start reading from the pipe
# IMPORTANT: autorestart=false because if keeper fails, grading should fail (no respawn)
[program:keeper]
command=/bin/sh -c "sleep infinity > /tmp/client_input"
priority=1
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/null
stderr_logfile=/dev/null

# Client process configuration  
# Started/stopped by test case actions via unified-control.sh
# Logs are written to /apps/client/client.log (unified log file)
# CRITICAL: Client reads from named pipe /tmp/client_input for input
# The keeper process (priority=1) holds the pipe open to prevent immediate EOF
# Uses wrapper script to redirect all output
[program:client]
command=/scripts/client-wrapper.sh
priority=10
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/null
stderr_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
