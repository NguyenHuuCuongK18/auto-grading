# Supervisord Configuration for Unified Container
# Manages server and client processes independently
# Logs are written per stage to separate files

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=127.0.0.1:9001

# Server process configuration
# Started/stopped by test case actions via unified-control.sh
[program:server]
command=/bin/bash -c "cd /apps/server && find . -name '*.dll' -not -name 'System.*.dll' -not -name 'Microsoft.*.dll' | head -1 | xargs dotnet"
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/logs/server.log
stderr_logfile=/logs/server.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
environment=DOTNET_CLI_TELEMETRY_OPTOUT=1,DOTNET_RUNNING_IN_CONTAINER=true,DOTNET_SYSTEM_CONSOLE_UNBUFFERED=1

# Client process configuration  
# Started/stopped by test case actions via unified-control.sh
[program:client]
command=/bin/bash -c "cd /apps/client && find . -name '*.dll' -not -name 'System.*.dll' -not -name 'Microsoft.*.dll' | head -1 | xargs dotnet"
autostart=false
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/logs/client.log
stderr_logfile=/logs/client.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
environment=DOTNET_CLI_TELEMETRY_OPTOUT=1,DOTNET_RUNNING_IN_CONTAINER=true,DOTNET_SYSTEM_CONSOLE_UNBUFFERED=1
